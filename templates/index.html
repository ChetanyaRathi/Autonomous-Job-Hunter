<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Job Hunter — Search On Demand</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0f1e;
            --surface: #131a2e;
            --card: #1a2340;
            --border: #2a3455;
            --text: #f0f4ff;
            --muted: #8892b0;
            --blue: #4f8aff;
            --blue-hover: #3a72e8;
            --green: #00d68f;
            --green-hover: #00b87a;
            --yellow: #f5a623;
            --red: #ff5757;
            --purple: #a78bfa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        /* === SEARCH HERO === */
        .search-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem 2rem;
            transition: padding 0.4s ease;
        }
        .search-hero.compact {
            padding: 2rem 2rem 1rem;
        }

        .logo {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #4f8aff, #a78bfa, #00d68f);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .search-hero.compact .logo { font-size: 2rem; }

        .tagline {
            color: var(--muted);
            font-size: 1.15rem;
            margin-bottom: 2rem;
        }
        .search-hero.compact .tagline { display: none; }

        .search-box {
            width: 100%;
            max-width: 700px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 1.1rem 1.5rem;
            padding-right: 3.5rem;
            font-size: 1.15rem;
            border: 2px solid var(--border);
            border-radius: 16px;
            background: var(--surface);
            color: var(--text);
            outline: none;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s;
        }
        .search-input:focus { border-color: var(--blue); }
        .search-input::placeholder { color: #556; }

        .search-icon {
            position: absolute;
            right: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.4rem;
            color: var(--muted);
            pointer-events: none;
        }

        /* Pills */
        .pills {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 1rem;
            max-width: 700px;
        }
        .pill {
            padding: 0.5rem 1rem;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--muted);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .pill:hover {
            border-color: var(--blue);
            color: var(--blue);
            background: rgba(79,138,255,0.08);
        }

        /* Time filter */
        .time-filters {
            display: flex;
            gap: 0.5rem;
            margin-top: 1.2rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .time-btn {
            padding: 0.5rem 1.2rem;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .time-btn:hover { border-color: var(--blue); color: var(--blue); }
        .time-btn.active {
            background: var(--blue);
            color: white;
            border-color: var(--blue);
        }

        /* Controls row */
        .controls-row {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-top: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-search {
            padding: 0.9rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--green), #00b87a);
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,214,143,0.3);
        }
        .btn-search:disabled {
            background: var(--border);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-runs {
            padding: 0.9rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .btn-runs:hover { border-color: var(--blue); color: var(--blue); }

        /* Email toggle */
        .email-toggle {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-top: 1rem;
            font-size: 0.9rem;
            color: var(--muted);
        }
        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute;
            inset: 0;
            background: var(--border);
            border-radius: 24px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .toggle-slider::before {
            content: '';
            position: absolute;
            width: 18px; height: 18px;
            left: 3px; bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: transform 0.2s;
        }
        .toggle-switch input:checked + .toggle-slider { background: var(--green); }
        .toggle-switch input:checked + .toggle-slider::before { transform: translateX(20px); }

        /* === STATUS === */
        .status-area {
            text-align: center;
            padding: 2rem;
            display: none;
        }
        .status-area.visible { display: block; }

        .spinner {
            width: 48px; height: 48px;
            border: 4px solid var(--border);
            border-top-color: var(--blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .status-text {
            font-size: 1.2rem;
            color: var(--muted);
        }

        /* === RESULTS === */
        .results-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 2rem 3rem;
            display: none;
        }
        .results-container.visible { display: block; }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .results-summary {
            font-size: 1.1rem;
            color: var(--muted);
        }
        .results-summary strong { color: var(--text); }

        .filter-bar {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            background: var(--surface);
            padding: 1rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }
        .filter-bar select, .filter-bar input {
            flex: 1;
            min-width: 180px;
            padding: 0.7rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            font-family: 'Inter', sans-serif;
        }
        .filter-bar select:focus, .filter-bar input:focus { border-color: var(--blue); }

        .job-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(370px, 1fr));
            gap: 1.25rem;
        }

        .job-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }
        .job-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0,0,0,0.4);
            border-color: #3a4a70;
        }
        .job-company {
            font-size: 1.35rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.2rem;
        }
        .job-title {
            font-size: 1.05rem;
            color: var(--muted);
            margin-bottom: 0.8rem;
        }
        .job-meta {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 0.85rem;
            flex-wrap: wrap;
            margin-bottom: 1.2rem;
        }
        .meta-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            color: var(--muted);
        }
        .visa-badge {
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 600;
        }
        .visa-likely { color: var(--green); background: rgba(0,214,143,0.12); }
        .visa-unknown { color: var(--yellow); background: rgba(245,166,35,0.12); }
        .visa-no { color: var(--red); background: rgba(255,87,87,0.12); }

        .score-section { margin-bottom: 1.2rem; flex-grow: 1; }
        .score-top {
            display: flex;
            justify-content: space-between;
            font-size: 0.82rem;
            color: var(--muted);
            margin-bottom: 5px;
        }
        .score-bar {
            height: 7px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }
        .score-fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--blue), var(--purple));
        }

        .btn-apply {
            display: block;
            text-align: center;
            padding: 0.75rem;
            border-radius: 10px;
            background: var(--green);
            color: white;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        .btn-apply:hover { background: var(--green-hover); }

        /* Modal */
        .modal-bg {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-bg.open { display: flex; }
        .modal-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 2rem;
            width: 520px;
            max-height: 70vh;
            overflow-y: auto;
        }
        .modal-box h3 { margin-bottom: 1rem; }
        .modal-x {
            float: right;
            background: none;
            border: none;
            color: var(--muted);
            font-size: 1.5rem;
            cursor: pointer;
        }
        .run-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.7rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .run-row:hover { background: rgba(79,138,255,0.08); border-color: var(--blue); }
        .run-row.active { background: rgba(79,138,255,0.1); border-color: var(--blue); }
        .run-badge {
            background: var(--blue);
            color: white;
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .job-card { animation: fadeIn 0.3s ease both; }

        @media (max-width: 768px) {
            .job-grid { grid-template-columns: 1fr; }
            .logo { font-size: 2rem; }
            .search-input { font-size: 1rem; }
        }
    </style>
</head>
<body>

<!-- SEARCH HERO -->
<div class="search-hero" id="searchHero">
    <div class="logo">🚀 Job Hunter</div>
    <div class="tagline">Find Entry Level Jobs with Visa Sponsorship in USA</div>

    <div class="search-box">
        <input type="text" id="searchInput" class="search-input"
               placeholder="e.g. Software Engineer entry level visa sponsorship"
               onkeydown="if(event.key==='Enter') doSearch()">
        <span class="search-icon">🔍</span>
    </div>

    <div class="pills">
        <span class="pill" onclick="fillSearch('Software Engineer')">Software Engineer</span>
        <span class="pill" onclick="fillSearch('ML Engineer')">ML Engineer</span>
        <span class="pill" onclick="fillSearch('Backend Engineer')">Backend Engineer</span>
        <span class="pill" onclick="fillSearch('Frontend Engineer')">Frontend Engineer</span>
        <span class="pill" onclick="fillSearch('Data Engineer')">Data Engineer</span>
        <span class="pill" onclick="fillSearch('DevOps Engineer')">DevOps Engineer</span>
    </div>

    <div class="time-filters">
        <button class="time-btn" data-val="1h" onclick="setTime(this)">⚡ Last 1 Hour</button>
        <button class="time-btn active" data-val="24h" onclick="setTime(this)">📅 Last 24 Hours</button>
        <button class="time-btn" data-val="7d" onclick="setTime(this)">📆 Last Week</button>
        <button class="time-btn" data-val="all" onclick="setTime(this)">🗓️ All Time</button>
    </div>

    <div class="controls-row">
        <button class="btn-search" id="searchBtn" onclick="doSearch()">🔍 Search Jobs</button>
        <button class="btn-runs" onclick="openRuns()">📂 Previous Runs</button>
    </div>

    <div class="email-toggle">
        <label class="toggle-switch">
            <input type="checkbox" id="emailToggle" checked>
            <span class="toggle-slider"></span>
        </label>
        <span>📧 Also email results to rathi.chetanya@gmail.com</span>
    </div>
</div>

<!-- STATUS -->
<div class="status-area" id="statusArea">
    <div class="spinner" id="spinner"></div>
    <div class="status-text" id="statusText">Initializing...</div>
</div>

<!-- RESULTS -->
<div class="results-container" id="resultsContainer">
    <div class="results-header">
        <div class="results-summary" id="resultsSummary"></div>
    </div>

    <div class="filter-bar">
        <input type="text" id="filterSearch" placeholder="Filter by company or title..." oninput="renderCards()">
        <select id="filterVisa" onchange="renderCards()">
            <option value="All">All Visa Statuses</option>
            <option value="Likely">Likely</option>
            <option value="Unknown">Unknown</option>
            <option value="No Sponsorship">No Sponsorship</option>
        </select>
        <select id="filterSort" onchange="renderCards()">
            <option value="score-desc">Score ↓</option>
            <option value="score-asc">Score ↑</option>
            <option value="company-asc">Company A-Z</option>
        </select>
    </div>

    <div class="job-grid" id="jobGrid"></div>
</div>

<!-- Runs Modal -->
<div class="modal-bg" id="runsModal" onclick="closeRuns(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
        <button class="modal-x" onclick="document.getElementById('runsModal').classList.remove('open')">&times;</button>
        <h3>📂 Previous Searches</h3>
        <div id="runsList"></div>
    </div>
</div>

<script>
    let allJobs = [];
    let currentRunId = '';
    let selectedTime = '24h';
    let statusPoll = null;

    function fillSearch(text) {
        document.getElementById('searchInput').value = text;
    }

    function setTime(btn) {
        document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedTime = btn.dataset.val;
    }

    async function doSearch() {
        const query = document.getElementById('searchInput').value.trim();
        if (!query) { alert('Please enter a search query!'); return; }

        const sendEmail = document.getElementById('emailToggle').checked;
        const btn = document.getElementById('searchBtn');
        btn.disabled = true;
        btn.innerText = '⏳ Searching...';

        // Show status, hide results
        document.getElementById('statusArea').classList.add('visible');
        document.getElementById('resultsContainer').classList.remove('visible');
        document.getElementById('spinner').style.display = 'block';
        document.getElementById('statusText').innerText = '🔍 Starting search...';

        // Compact the hero
        document.getElementById('searchHero').classList.add('compact');

        try {
            const res = await fetch('/api/search', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({query, time_filter: selectedTime, send_email: sendEmail})
            });
            const data = await res.json();
            currentRunId = data.run_id;
            startStatusPolling(query);
        } catch(e) {
            document.getElementById('statusText').innerText = '❌ Error starting search!';
            document.getElementById('spinner').style.display = 'none';
            btn.disabled = false;
            btn.innerText = '🔍 Search Jobs';
        }
    }

    function startStatusPolling(query) {
        if (statusPoll) clearInterval(statusPoll);
        statusPoll = setInterval(async () => {
            try {
                const res = await fetch('/api/search/status');
                const data = await res.json();
                document.getElementById('statusText').innerText = data.message;

                if (data.stage === 'done' || data.stage === 'error') {
                    clearInterval(statusPoll);
                    statusPoll = null;
                    document.getElementById('spinner').style.display = 'none';
                    document.getElementById('searchBtn').disabled = false;
                    document.getElementById('searchBtn').innerText = '🔍 Search Jobs';

                    if (data.stage === 'done' && data.run_id) {
                        loadRunJobs(data.run_id, query);
                    }
                }
            } catch(e) { console.error(e); }
        }, 1000);
    }

    async function loadRunJobs(runId, query) {
        try {
            const res = await fetch(`/api/jobs?run_id=${runId}&posted_within=all`);
            const data = await res.json();
            allJobs = data.jobs || [];
            currentRunId = data.run_id;

            const label = query || currentRunId;
            document.getElementById('resultsSummary').innerHTML =
                `✅ Found <strong>${allJobs.length}</strong> jobs for '<strong>${label}</strong>'`;

            document.getElementById('statusArea').classList.remove('visible');
            document.getElementById('resultsContainer').classList.add('visible');
            renderCards();
        } catch(e) { console.error(e); }
    }

    function renderCards() {
        const grid = document.getElementById('jobGrid');
        grid.innerHTML = '';

        const search = document.getElementById('filterSearch').value.toLowerCase();
        const visa = document.getElementById('filterVisa').value;
        const sort = document.getElementById('filterSort').value;

        let list = allJobs.filter(j => {
            const mSearch = j.company.toLowerCase().includes(search) || j.title.toLowerCase().includes(search);
            const mVisa = visa === 'All' || j.visa === visa;
            return mSearch && mVisa;
        });

        if (sort === 'score-desc') list.sort((a,b) => b.score - a.score);
        else if (sort === 'score-asc') list.sort((a,b) => a.score - b.score);
        else if (sort === 'company-asc') list.sort((a,b) => a.company.localeCompare(b.company));

        if (list.length === 0) {
            grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--muted);">No jobs match your filters.</div>';
            return;
        }

        const now = new Date();
        list.forEach((job, i) => {
            let vc = 'visa-unknown';
            if (job.visa === 'Likely') vc = 'visa-likely';
            if (job.visa === 'No Sponsorship') vc = 'visa-no';

            let ago = '';
            if (job.timestamp) {
                const jt = new Date(job.timestamp + 'Z');
                const h = Math.floor((now - jt) / 3600000);
                if (h >= 24) ago = `🕐 ${Math.floor(h/24)}d ago`;
                else if (h > 0) ago = `🕐 ${h}h ago`;
                else ago = '🕐 Just now';
            }

            const pct = Math.min((job.score / 30) * 100, 100);
            const card = document.createElement('div');
            card.className = 'job-card';
            card.style.animationDelay = `${i * 0.04}s`;
            card.innerHTML = `
                <div class="job-company">${job.company}</div>
                <div class="job-title">${job.title}</div>
                <div class="job-meta">
                    <span class="meta-tag">📍 ${job.location}</span>
                    <span class="meta-tag">${ago}</span>
                    <span class="visa-badge ${vc}">${job.visa}</span>
                </div>
                <div class="score-section">
                    <div class="score-top"><span>Match Score</span><span>${job.score}/30</span></div>
                    <div class="score-bar"><div class="score-fill" style="width:${pct}%"></div></div>
                </div>
                <a href="${job.apply_link}" target="_blank" class="btn-apply">APPLY NOW</a>
            `;
            grid.appendChild(card);
        });
    }

    async function openRuns() {
        document.getElementById('runsModal').classList.add('open');
        try {
            const res = await fetch('/api/runs');
            const runs = await res.json();
            const list = document.getElementById('runsList');
            list.innerHTML = '';
            if (!runs.length) {
                list.innerHTML = '<p style="color:var(--muted)">No previous searches found.</p>';
                return;
            }
            runs.forEach(r => {
                const div = document.createElement('div');
                div.className = 'run-row' + (r.run_id === currentRunId ? ' active' : '');
                const t = r.run_time ? new Date(r.run_time + 'Z').toLocaleString('en-US', {month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit', hour12:true}) : r.run_id;
                div.innerHTML = `<span>${t}</span><span class="run-badge">${r.job_count} jobs</span>`;
                div.onclick = () => {
                    document.getElementById('runsModal').classList.remove('open');
                    loadRunJobs(r.run_id, '');
                };
                list.appendChild(div);
            });
        } catch(e) { console.error(e); }
    }

    function closeRuns(e) {
        if (e.target === e.currentTarget) e.target.classList.remove('open');
    }
</script>
</body>
</html>
